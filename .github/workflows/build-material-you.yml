name: Build Material You accent

on:
  push:
    branches: [material-you-accent]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Point Gradle at the runner's Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          chmod +x gradlew

      - name: Test the accent feature
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :extensions:facebook:testDebugUnitTest \
            --tests 'app.morphe.extension.facebook.theme.Accent*' \
            --tests 'app.morphe.extension.facebook.settings.ListRowSummaryTest' \
            --tests 'app.morphe.extension.shared.L10nCatalogTest'

      - name: Build the patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :patches:generatePatchesList :patches:buildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: patches-material-you
          path: patches/build/release/*.mpp
          if-no-files-found: error
